<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%238250df' d='M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0Zm7.25.128a.75.75 0 0 0-.75.75v4.378a2.251 2.251 0 1 0 1.5 0V6.25A2.25 2.25 0 0 0 10.75 4H9.56l1.22-1.22a.75.75 0 0 0-1.06-1.06L7.22 4.22a.75.75 0 0 0 0 1.06l2.5 2.5a.75.75 0 0 0 1.06-1.06L9.56 5.5h1.19a.75.75 0 0 1 .75.75Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/app.css">
  <script src="/vendor/diff.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="sidebarBtn" title="Show/hide PR list (L)">☰</button>
    <div class="brand">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0Zm7.25.128a.75.75 0 0 0-.75.75v4.378a2.251 2.251 0 1 0 1.5 0V6.25A2.25 2.25 0 0 0 10.75 4H9.56l1.22-1.22a.75.75 0 0 0-1.06-1.06L7.22 4.22a.75.75 0 0 0 0 1.06l2.5 2.5a.75.75 0 0 0 1.06-1.06L9.56 5.5h1.19a.75.75 0 0 1 .75.75Z"/></svg>
      <span>PR Viewer</span>
    </div>
    <div class="repo-picker" id="repoPicker">
      <button class="repo-button" id="repoButton" aria-haspopup="listbox" aria-expanded="false">
        <span class="repo-icon">▤</span>
        <span id="repoLabel">Choose a repository …</span>
        <span class="caret">▾</span>
      </button>
      <div class="repo-menu" id="repoMenu" hidden>
        <input id="repoFilter" type="search" placeholder="Filter repositories …" autocomplete="off" spellcheck="false">
        <ul id="repoList" role="listbox"></ul>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refreshBtn" title="Reload (R)">⟳</button>
    <div class="user" id="userBox"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="state-tabs" role="tablist" id="stateTabs">
        <button data-state="open" class="active">Open</button>
        <button data-state="closed">Closed</button>
        <button data-state="all">All</button>
      </div>
      <input id="prFilter" class="pr-filter" type="search" placeholder="Filter PRs …" spellcheck="false">
      <ul class="pr-list" id="prList"></ul>
      <button class="more-btn" id="morePrs" hidden>Load more</button>
    </aside>

    <main class="main" id="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⇄</div>
        <p>Choose a repository and a pull request on the left.</p>
      </div>
    </main>
  </div>

  <dialog id="mergeDialog" class="dialog">
    <form method="dialog" id="mergeForm">
      <h2>Merge pull request</h2>
      <p class="dialog-sub" id="mergeSub"></p>
      <label>Method
        <select id="mergeMethod"></select>
      </label>
      <label>Commit title
        <input id="mergeTitle" type="text">
      </label>
      <label>Commit message
        <textarea id="mergeMessage" rows="5"></textarea>
      </label>
      <p class="dialog-error" id="mergeError" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">Cancel</button>
        <button value="confirm" class="btn btn-primary" id="mergeConfirm">Confirm merge</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
